[package]
name = "dshd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
base64 = "=0.22.1"
argon2 = "0.5"
axum = "=0.8.4"
clap = { version = "=4.5.37", features = ["derive", "env"] }
chrono = { version = "=0.4.42", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "=0.10.4", features = ["serde"] }
crc32fast = "=1.5.3"
ed25519-dalek = "2.1"
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
md-5 = "=0.10.6"
rand = "0.8"
png = "=0.18.1"
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.3"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "=0.10.6"
subtle = "2.6"
tokio = { version = "1.44", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
dsh-kernel = { path = "../dsh-kernel" }
tower-http = { version = "=0.6.2", features = ["fs", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "portable-dispatch", "extra-checks"] }
wasmparser = "=0.228.0"
wat = "=1.228.0"
wasmtime = { version = "=36.0.19", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wit-component = "=0.228.0"
wit-parser = "=0.228.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.19"
tower = { version = "0.5", features = ["util"] }
